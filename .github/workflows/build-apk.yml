name: Build Wohnungsverwaltung APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Decode signing keystore
      if: and(secrets.SIGNING_STORE_FILE != '', secrets.SIGNING_STORE_PASSWORD != '', secrets.SIGNING_KEY_ALIAS != '', secrets.SIGNING_KEY_PASSWORD != '')
      run: |
        echo "${{ secrets.SIGNING_STORE_FILE }}" | base64 -d > keystore.jks
        echo "Keystore dekodiert: keystore.jks"

    - name: Build Release APK (signiert, installierbar überall)
      if: and(secrets.SIGNING_STORE_FILE != '', secrets.SIGNING_STORE_PASSWORD != '', secrets.SIGNING_KEY_ALIAS != '', secrets.SIGNING_KEY_PASSWORD != '')
      run: |
        ./gradlew assembleRelease \
          -PSIGNING_STORE_FILE=keystore.jks \
          -PSIGNING_STORE_PASSWORD="${{ secrets.SIGNING_STORE_PASSWORD }}" \
          -PSIGNING_KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}" \
          -PSIGNING_KEY_PASSWORD="${{ secrets.SIGNING_KEY_PASSWORD }}" \
          --no-daemon

    - name: Warn: Kein Signing-Keystore konfiguriert
      if: secrets.SIGNING_STORE_FILE == ''
      run: |
        echo "Kein Signing-Keystore in den GitHub Secrets gefunden."
        echo "Ohne Signierung ist die Release-APK auf den meisten Android-Geräten NICHT installierbar."
        echo "Siehe README.md: Release-APK für Verteilung."

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: wohnungsverwaltung-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release APK
      if: and(success(), secrets.SIGNING_STORE_FILE != '')
      uses: actions/upload-artifact@v4
      with:
        name: wohnungsverwaltung-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30